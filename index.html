    <script>
      // 1. Mock vite-hmr WebSocket to prevent "WebSocket closed without opened" in preview iframe
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          var MockWS = function(url, protocols) {
            var isHmr = (protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1));
            if (isHmr) {
              var target = new EventTarget();
              target.readyState = 1; // WebSocket.OPEN
              target.url = url;
              target.protocol = 'vite-hmr';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.binaryType = 'blob';
              target.send = function() {};
              target.close = function() {};
              target.onopen = null;
              target.onclose = null;
              target.onerror = null;
              target.onmessage = null;
              setTimeout(function() {
                var ev = new Event('open');
                if (typeof target.onopen === 'function') target.onopen(ev);
                target.dispatchEvent(ev);
              }, 0);
              return target;
            }
            return new OrigWS(url, protocols);
          };
          MockWS.prototype = OrigWS.prototype;
          MockWS.CONNECTING = OrigWS.CONNECTING || 0;
          MockWS.OPEN = OrigWS.OPEN || 1;
          MockWS.CLOSING = OrigWS.CLOSING || 2;
          MockWS.CLOSED = OrigWS.CLOSED || 3;
          window.WebSocket = MockWS;
        }

        // 2. Suppress console.error and window error events for Vite HMR WebSocket
        var origConsoleError = console.error;
        console.error = function() {
          var msg = arguments && arguments[0] ? String(arguments[0].message || arguments[0]) : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1 || (msg.indexOf('[vite]') !== -1 && msg.indexOf('WebSocket') !== -1)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var str = event && event.reason ? String(event.reason.message || event.reason) : '';
          if (str.indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var str = event && event.message ? String(event.message) : '';
          if (str.indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
