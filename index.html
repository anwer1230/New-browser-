    <script>
      // Suppress Vite HMR WebSocket closing warning in iframe preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason.message || event.reason).includes('WebSocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && event.message && String(event.message).includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
