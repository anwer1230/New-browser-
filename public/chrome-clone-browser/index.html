<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متصفحي</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ===== شريط التبويبات (مثل كروم) ===== -->
  <div class="tab-strip">
    <div class="tabs-container" id="tabsContainer"></div>
    <button class="new-tab-btn" id="newTabBtn" title="تبويب جديد">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- ===== شريط العنوان (Omnibox) ===== -->
  <div class="omnibox-bar">
    <div class="nav-buttons">
      <button class="nav-btn" id="backBtn" title="رجوع">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <button class="nav-btn" id="forwardBtn" title="تقدم">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <button class="nav-btn" id="refreshBtn" title="تحديث">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/>
        </svg>
      </button>
      <button class="nav-btn" id="homeBtn" title="الرئيسية">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12l9-9 9 9M5 10v10h14V10"/>
        </svg>
      </button>
    </div>

    <div class="omnibox-wrapper">
      <div class="omnibox-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
      </div>
      <input 
        type="text" 
        id="omnibox" 
        class="omnibox-input"
        placeholder="ابحث في Google أو اكتب عنوان URL"
        autocomplete="off"
        spellcheck="false"
      >
      <button class="omnibox-action" id="subtitleModeBtn" title="وضع الترجمة العربية">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M7 15h4M13 15h4M7 11h10"/>
        </svg>
      </button>
    </div>

    <div class="right-actions">
      <button class="nav-btn" id="bookmarksBtn" title="الإشارات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
        </svg>
      </button>
      <button class="nav-btn" id="menuBtn" title="القائمة">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.5"/>
          <circle cx="12" cy="12" r="1.5"/>
          <circle cx="12" cy="19" r="1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ===== شريط الإشارات ===== -->
  <div class="bookmarks-bar" id="bookmarksBar">
    <div class="bookmark-item">📌 Google</div>
    <div class="bookmark-item">📌 YouTube</div>
    <div class="bookmark-item">📌 OpenSubtitles</div>
  </div>

  <!-- ===== منطقة عرض المحتوى ===== -->
  <div class="content-area">
    <!-- الصفحة الرئيسية (مثل كروم) -->
    <div class="new-tab-page" id="newTabPage">
      <div class="new-tab-content">
        <div class="google-logo">
          <span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span>
        </div>
        <div class="search-box">
          <input type="text" id="newTabSearch" placeholder="ابحث في Google">
        </div>
        <div class="shortcuts">
          <div class="shortcut" data-url="https://www.youtube.com">
            <div class="shortcut-icon" style="background:#FF0000">▶</div>
            <span>YouTube</span>
          </div>
          <div class="shortcut" data-url="https://www.google.com">
            <div class="shortcut-icon" style="background:#4285F4">G</div>
            <span>Google</span>
          </div>
          <div class="shortcut" data-url="https://www.opensubtitles.org">
            <div class="shortcut-icon" style="background:#00A8E1">📁</div>
            <span>OpenSubtitles</span>
          </div>
          <div class="shortcut" data-url="https://www.subdl.com">
            <div class="shortcut-icon" style="background:#4CAF50">S</div>
            <span>SubDL</span>
          </div>
        </div>
      </div>
    </div>

    <!-- إطار عرض الصفحات -->
    <iframe 
      id="webView" 
      class="web-view" 
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals"
      style="display:none;"
    ></iframe>

    <!-- منطقة عرض نتائج الترجمة المخصصة -->
    <div class="subtitle-results" id="subtitleResults" style="display:none;">
      <div class="results-header">
        <h2>نتائج البحث عن الترجمات العربية</h2>
        <div class="results-meta" id="resultsMeta"></div>
      </div>
      <div class="results-container" id="resultsContainer"></div>
    </div>
  </div>

  <!-- ===== شريط الحالة ===== -->
  <div class="status-bar" id="statusBar"></div>

  <script src="js/browser.js" type="module"></script>
</body>
</html>
