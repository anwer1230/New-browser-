services:
  # 1. الخدمة الرئيسية الشاملة (واجهة المتصفح الموحّد + خادم الترجمة والـ Proxy وقاعدة البيانات)
  - type: web
    name: anwerbrowser
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
      - key: GROQ_API_KEY
        sync: false

  # 2. خادم Python FastAPI المستقل للترجمة والذكاء الاصطناعي (اختياري لتطبيق Flutter)
  - type: web
    name: anwerbrowser-python-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: hybrid_browser/server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn media_server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
