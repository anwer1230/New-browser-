[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:redis]
command=redis-server --bind 0.0.0.0 --save 60 1 --appendonly yes
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err

[program:qdrant]
command=/qdrant/qdrant
environment=QDRANT__SERVICE__HTTP_PORT="6333",QDRANT__SERVICE__GRPC_PORT="6334",QDRANT__STORAGE__STORAGE_PATH="/qdrant/storage"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/qdrant.log
stderr_logfile=/var/log/supervisor/qdrant.err

[program:ollama]
command=/usr/local/bin/ollama serve
environment=OLLAMA_HOST="0.0.0.0:11434",OLLAMA_NUM_PARALLEL="2",OLLAMA_MAX_LOADED_MODELS="2",OLLAMA_KEEP_ALIVE="30m"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/ollama.log
stderr_logfile=/var/log/supervisor/ollama.err

[program:api]
command=/app/venv/bin/uvicorn server:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err

[program:webui]
command=node /app/webui/build/index.js
environment=OLLAMA_BASE_URL="http://localhost:11434",OPENAI_API_BASE_URL="http://localhost:8000/v1",OPENAI_API_KEY="dummy",WEBUI_AUTH="True",WEBUI_SECRET_KEY="change-me-please"
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/webui.log
stderr_logfile=/var/log/supervisor/webui.err
